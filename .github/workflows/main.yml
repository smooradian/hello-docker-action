on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Hello world action step
        id: hello
        uses: ./
        with:
          who-to-greet: 'Sara'

      - name: Get the output time
        run: echo "The time was ${{ steps.hello.outputs.time }}"
